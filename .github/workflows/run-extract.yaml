name: Skills & Levels Extraction

on:
  workflow_dispatch:
    inputs:
      confirm_external_access:
        description: "Run external collection or write to the configured test spreadsheet"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
